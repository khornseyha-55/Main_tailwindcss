<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Sign in</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }
        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }   
        .container .cover {
            width: 70%;
            height: auto;
            background-color: whitesmoke;
            display: flex;
            border-radius: 10px;
            box-shadow: rgba(50, 50, 93, 0.25) 0px 13px 27px -5px, rgba(0, 0, 0, 0.3) 0px 8px 16px -8px;
        }
        .container .cover .logo-img {
            width: 100%;
            height: 500px;
        }
        .container .cover .logo-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px 0px 0px 10px;
        }
        .form-control {
            width: 100%;
            height: 500px;
            padding: 30px;
        }
        .form-control h1 {
            text-align: center;
            padding: 15px 0px;
        }
        .form-control p {
            text-align: center;
            padding-bottom: 10px;
        }
        .form-control form span {
            font-size: 1rem;
            color: #444;
        }
        .form-control form input {
            width: 100%;
            height: 45px;
            padding: 10px;
            margin: 20px 0px;
            border: 1px solid gray;
            border-radius: 10px;
            outline: none;
        }
        .form-control .sign_in{
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            margin: 12px 0px;
            border: none;
            font-size: 1.2rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            background-color: dodgerblue;
            box-shadow: rgba(50, 50, 93, 0.25) 0px 13px 27px -5px;
            transition: all 0.2s ease-in;
        }
        .form-control .create{
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            margin: 12px 0px;
            border: none;
            font-weight: 600;
            font-size: 1.2rem;
            cursor: pointer;
            background-color: gainsboro;
            box-shadow: rgba(50, 50, 93, 0.25) 0px 13px 27px -5px;
            transition: all 0.2s ease-in;
        }
        @media screen and (max-width:700px) {
            .container .cover .logo-img {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="cover">
            <div class="logo-img">
                <img src="https://i.pinimg.com/1200x/a8/4e/7c/a84e7c6ce83b799bd8318ee0de2bc451.jpg" alt="">
            </div>
            <div class="form-control">
                <h1>Sing in</h1>
                <p>Unlock Your World..</p>
                <form action="">
                    <span>Email</span> <br>
                    <input type="email" placeholder="Enter your Email..."> <br>
                    <span>Password</span> <br>
                    <input type="password" placeholder="Enter your password...">
                </form>
                <button class="sign_in">Sing in</button>
                <button class="create">Create an Account</button>
            </div>

        </div>
    </div>
</body>
</html>
